  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #fdf7f7;
      color: #4a2020;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 36px 16px 44px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .avatar {
      width: 114px;
      height: 114px;
      border-radius: 50%;
      object-fit: cover;
      background: #ffffff;
      border: 4px solid #ffffff;
      box-shadow: 0 6px 18px rgba(176, 48, 48, 0.16);
      display: block;
      margin: 0 auto 14px;
    }

    h1 {
      font-family: 'Merriweather', Georgia, serif;
      font-size: 26px;
      font-weight: 700;
      color: #a62626;
      margin-bottom: 12px;
    }

    .social-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
    }

    .social-row a {
      color: #b83b3b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, color 0.15s ease;
    }

    .social-row a:hover {
      transform: translateY(-2px);
      color: #8c1d1d;
    }

    .social-row svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .card {
      background-color: #f7e1e1;
      border: 1.5px solid #eccbcb;
      border-radius: 26px;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      box-shadow: 0 8px 22px rgba(166, 38, 38, 0.08);
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      background-color: #ffffff;
      color: #2e1515;
      padding: 13px 16px;
      border-radius: 14px;
      border: 2px solid #c96a6a;
      box-shadow: 0 4px 0 #c96a6a;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
      text-align: left;
    }

    .btn:hover {
      background-color: #fff8f8;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #c96a6a;
    }

    .icon-box {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background-color: #fcebeb;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #c0392b;
    }

    .icon-box svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .text {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
      color: #2e1515;
    }

    .sub {
      font-size: 12.5px;
      font-weight: 500;
      color: #785959;
      margin-top: 2px;
    }

    footer {

      font-size: 12px;
      color: #9e7878;
